name: Java Maven App CI/CD to EKS
on:
  push:
    branches:
      - github-actions
    
jobs:
  CI:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      IMAGE_NAME: ${{ steps.set_version.outputs.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Set image version
        id: set_version
        run: |
          VERSION=$(grep -m1 '<version>.*</version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')
          IMAGE_TAG="my-java-app-$VERSION-$GITHUB_RUN_NUMBER"
          echo "IMAGE_NAME=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-bootcamp:${{ steps.set_version.outputs.IMAGE_NAME }}

      - name: Scan Docker image with Docker Scout
        uses: docker/scout-action@v1
        with:
            command: cves
            image: ${{ secrets.DOCKER_USERNAME }}/devops-bootcamp:${{ steps.set_version.outputs.IMAGE_NAME }}
      
  CD:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Install aws-iam-authenticator
        run: |
          curl -Lo aws-iam-authenticator https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v0.7.15/aws-iam-authenticator_0.7.15_linux_amd64
          chmod +x aws-iam-authenticator
          mv aws-iam-authenticator /usr/local/bin/

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name demo-eks --region ap-southeast-2

      - name: Install envsubst
        run: sudo apt-get install -y gettext-base

      - name: Deploy to EKS
        env:
          APP_NAME: 'java-maven-app'
          APP_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/devops-bootcamp:${{ needs.CI.outputs.IMAGE_NAME }}
        run: |
          envsubst < kubernetes/deployment.yaml | kubectl apply -f -
          envsubst < kubernetes/service.yaml | kubectl apply -f -
          kubectl rollout status deployment/$APP_NAME --namespace=default