name: Java CI/CD with Maven
on: 
  push:
    branches: [ "github-actions" ]
jobs:
  CI:
    runs-on: ubuntu-latest
    outputs:
      IMAGE_NAME: ${{ steps.set_version.outputs.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
      
