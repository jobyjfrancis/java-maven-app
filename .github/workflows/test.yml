name: Test

on:
  push:
    branches: ["github-actions"]

jobs:
  CI:
    runs-on: ubuntu-latest

    outputs:
      IMAGE_NAME: ${{ steps.set_version.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v4
      - name: Set image version
        id: set_version
        run: |
          VERSION=$(grep -m1 '<version>.*</version>' pom.xml | sed -E 's/.*<version>(.+)<\/version>.*/\1/')
          IMAGE_TAG="jobyjfrancis/my-java-app-$VERSION-$GITHUB_RUN_NUMBER"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  CD:
    runs-on: ubuntu-latest
    needs: CI

    steps:
      - name: Debug IMAGE_NAME
        env:
          IMAGE_NAME: ${{ needs.CI.outputs.IMAGE_NAME }}
        run: echo "IMAGE_NAME is $IMAGE_NAME"